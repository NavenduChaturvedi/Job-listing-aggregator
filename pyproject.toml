[project]
name = "job-listing-aggregator"
version = "1.0.0"
description = "Scrape remote job boards, deduplicate, filter, and export clean CSV/JSON."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Navendu Chaturvedi" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
]

[project.urls]
Repository = "https://github.com/NavenduChaturvedi/Job-listing-aggregator"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
job-aggregator = "aggregator:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
